name: Build & Validate Kalyx SSL Console (Linux & Windows - VST3, LV2, CLAP, Standalone)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dsp-prototype-validation:
    name: Validate DSP Prototype (Python NumPy/SciPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy & SciPy
        run: pip install numpy scipy

      - name: Run DSP Prototype & Stability Suite
        run: python3 scripts/dsp_prototype.py

  build-linux:
    name: Build Linux (VST3, LV2, CLAP, Standalone)
    needs: dsp-prototype-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio & X11 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libcurl4-openssl-dev

      - name: Configure CMake (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build All Plugin Targets
        run: cmake --build build --config Release -j $(nproc)

      - name: Upload Linux Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KalyxSSLConsole-Linux-x64
          path: |
            build/KalyxSSLConsole_artefacts/Release/VST3/**
            build/KalyxSSLConsole_artefacts/Release/LV2/**
            build/KalyxSSLConsole_artefacts/Release/CLAP/**
            build/KalyxSSLConsole_artefacts/Release/Standalone/**

  build-windows:
    name: Build Windows (VST3, LV2, CLAP, Standalone - Static MSVC)
    needs: dsp-prototype-validation
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build All Plugin Targets (Release)
        run: cmake --build build --config Release --parallel

      - name: Upload Windows Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KalyxSSLConsole-Windows-x64
          path: |
            build/KalyxSSLConsole_artefacts/Release/VST3/**
            build/KalyxSSLConsole_artefacts/Release/LV2/**
            build/KalyxSSLConsole_artefacts/Release/CLAP/**
            build/KalyxSSLConsole_artefacts/Release/Standalone/**
