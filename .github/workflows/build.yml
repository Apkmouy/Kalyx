name: Build & Validate Kalyx Suite (Hybrid Console & Bass Rig - Linux & Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dsp-prototype-validation:
    name: Validate 64-Bit DSP Prototypes (Python NumPy/SciPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy & SciPy
        run: pip install numpy scipy

      - name: Run Kalyx Hybrid Console DSP Prototype
        run: python3 scripts/dsp_prototype.py

      - name: Run Kalyx Bass Rig DSP Prototype (< -120 dBFS)
        run: python3 KalyxBassRig/scripts/dsp_prototype.py

  build-linux:
    name: Build Linux (VST3, LV2, CLAP, Standalone)
    needs: dsp-prototype-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio & X11 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libcurl4-openssl-dev

      - name: Configure & Build KalyxHybridConsole (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $(nproc)

      - name: Configure & Build KalyxBassRig (Release)
        run: |
          cmake -S KalyxBassRig -B KalyxBassRig/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build KalyxBassRig/build --config Release -j $(nproc)

      - name: Upload KalyxHybridConsole Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KalyxHybridConsole-Linux-x64
          path: |
            build/KalyxHybridConsole_artefacts/Release/VST3/**
            build/KalyxHybridConsole_artefacts/Release/LV2/**
            build/KalyxHybridConsole_artefacts/Release/CLAP/**
            build/KalyxHybridConsole_artefacts/Release/Standalone/**

      - name: Upload KalyxBassRig Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KalyxBassRig-Linux-x64
          path: |
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/VST3/**
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/LV2/**
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/CLAP/**
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/Standalone/**

  build-windows:
    name: Build Windows (VST3, LV2, CLAP, Standalone - Static MSVC)
    needs: dsp-prototype-validation
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure & Build KalyxHybridConsole (MSVC x64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Configure & Build KalyxBassRig (MSVC x64)
        run: |
          cmake -S KalyxBassRig -B KalyxBassRig/build -DCMAKE_BUILD_TYPE=Release
          cmake --build KalyxBassRig/build --config Release --parallel

      - name: Upload KalyxHybridConsole Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KalyxHybridConsole-Windows-x64
          path: |
            build/KalyxHybridConsole_artefacts/Release/VST3/**
            build/KalyxHybridConsole_artefacts/Release/LV2/**
            build/KalyxHybridConsole_artefacts/Release/CLAP/**
            build/KalyxHybridConsole_artefacts/Release/Standalone/**

      - name: Upload KalyxBassRig Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KalyxBassRig-Windows-x64
          path: |
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/VST3/**
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/LV2/**
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/CLAP/**
            KalyxBassRig/build/KalyxBassRig_artefacts/Release/Standalone/**
